name: "🐛 Bug Report"
description: Report a bug or unexpected behavior.
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste tokens, credentials, private instance URLs, or unredacted logs.
        Report vulnerabilities through a [private GitHub Security Advisory](https://github.com/clezcoding/awesome-coolify/security/advisories/new), not this public issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect instead?
      placeholder: A short, clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: How can this be reproduced?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include sanitized errors or logs if useful. Remove credentials and private URLs.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Package Version / Commit
      placeholder: e.g. 1.0.1 or commit hash
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js Version
      placeholder: e.g. 24.4.1
    validations:
      required: true

  - type: input
    id: coolify
    attributes:
      label: Coolify Version
      placeholder: e.g. 4.1.x
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP Client
      placeholder: e.g. Cursor
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - macOS
        - Linux
        - Windows
        - CI
        - Other
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues before opening this one.
          required: true
        - label: I removed tokens, credentials, private URLs, and sensitive log data.
          required: true
