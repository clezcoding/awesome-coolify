name: Lock Threads

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-threads
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6
        with:
          issue-inactive-days: '90'
          pr-inactive-days: '60'
          process-only: 'issues, prs'
          issue-comment: >
            This issue has been automatically locked because there has been no
            recent activity. Please open a new issue for related bugs.
          pr-comment: >
            This pull request has been automatically locked because there has
            been no recent activity.
