name: Lock Threads

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-threads
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: '90'
          pr-inactive-days: '60'
          process-only: 'issues, prs'
          issue-comment: >
            This issue has been automatically locked because there has been no
            recent activity. Please open a new issue for related bugs.
          pr-comment: >
            This pull request has been automatically locked because there has
            been no recent activity.
