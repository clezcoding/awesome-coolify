name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Version PR / Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC npm publish (add Trusted Publisher for release.yml on npmjs.com)
    env:
      HUSKY: 0 # changesets commits must not hit local commit-msg hooks in CI
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Opens a "Version Packages" PR when changesets land on main.
      # After that PR merges: `publish` must be set or the action skips
      # ("Not publishing because no publish script found").
      # `changeset:emit-tag` creates+pushes `v*` tag and GitHub Release;
      # createGithubReleases stays false — with pnpm-workspace the action
      # would otherwise `git push` a missing `name@version` tag.
      #
      # npm publish runs HERE (not publish.yml): GITHUB_TOKEN-created
      # releases do not trigger other workflows. OIDC Trusted Publisher
      # on npmjs.com must allow workflow filename `release.yml`.
      - name: Changesets
        id: changesets
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          version: pnpm run version
          publish: pnpm run changeset:emit-tag
          createGithubReleases: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Belt-and-suspenders: never fail main on re-publish of an existing version.
      # Primary gate is changeset-emit-new-tag.mjs (only prints New tag: when
      # the version is missing from npm → changesets.outputs.published).
      - name: Build & Publish to npm
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Already on npm: ${NAME}@${VERSION} — skip publish"
            exit 0
          fi
          pnpm run build
          npm publish
