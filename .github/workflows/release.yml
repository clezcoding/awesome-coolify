name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version PR / Create Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    env:
      HUSKY: 0 # changesets commits must not hit local commit-msg hooks in CI
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Opens a "Version Packages" PR when changesets land on main.
      # After that PR merges: `publish` must be set or the action skips
      # ("Not publishing because no publish script found").
      # `changeset:emit-tag` creates+pushes `v*` tag and GitHub Release;
      # createGithubReleases stays false — with pnpm-workspace the action
      # would otherwise `git push` a missing `name@version` tag.
      #
      # npm publish is a reusable workflow call (publish.yml) — GITHUB_TOKEN
      # release events do not chain to other workflows.
      - name: Changesets
        id: changesets
        uses: changesets/action@v1.9.0
        with:
          version: pnpm run version
          publish: pnpm run changeset:emit-tag
          createGithubReleases: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
