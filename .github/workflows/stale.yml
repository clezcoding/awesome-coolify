name: Stale

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark and close stale issues and pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-stale: 60
          days-before-close: 14
          days-before-issue-stale: 60
          days-before-pr-stale: 60
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,type: security,help wanted'
          exempt-pr-labels: 'pinned,security,type: security,help wanted'
          operations-per-run: 30
          remove-stale-when-updated: true
