name: Publish to npm

# Backup path for human/PAT-created GitHub Releases (fires `release: published`).
# Bot releases from release.yml use GITHUB_TOKEN and do NOT chain here — that
# path publishes inside release.yml instead (OIDC, same Trusted Publisher).
#
# One-time setup on npmjs.com before this works:
#   Package settings -> Trusted Publisher -> GitHub Actions
#   Repo: clezcoding/awesome-coolify, Workflow: publish.yml (and release.yml)
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # npm auto-detects the GitHub Actions OIDC token when npm >= 11.5.1
      # and no NODE_AUTH_TOKEN/NPM_TOKEN is set — nothing else to configure.
      - name: Publish
        run: npm publish
