name: Publish to npm

# Legacy trigger for human/PAT-created GitHub Releases.
# npm allows only ONE Trusted Publisher — currently `release.yml` (bot path).
# This workflow will 404 on OIDC unless Trusted Publisher is switched back here.
# Prefer bot Version Packages → release.yml inline publish.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # npm auto-detects the GitHub Actions OIDC token when npm >= 11.5.1
      # and no NODE_AUTH_TOKEN/NPM_TOKEN is set — nothing else to configure.
      # Skip if this version is already on the registry (manual re-release).
      - name: Publish
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Already on npm: ${NAME}@${VERSION} — skip publish"
            exit 0
          fi
          npm publish
