name: Publish to npm

# Legacy trigger for human/PAT-created GitHub Releases.
# npm allows only ONE Trusted Publisher — currently `release.yml` (bot path).
# This workflow will 404 on OIDC unless Trusted Publisher is switched back here.
# Prefer bot Version Packages → release.yml inline publish.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # npm auto-detects the GitHub Actions OIDC token when npm >= 11.5.1
      # and no NODE_AUTH_TOKEN/NPM_TOKEN is set — nothing else to configure.
      - name: Publish
        run: npm publish
