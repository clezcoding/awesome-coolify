name: Publish to npm

# npm Trusted Publisher is registered for this workflow file (publish.yml).
# Two entry points:
#   1) release: published — human/PAT-created GitHub Releases
#   2) workflow_call — bot path from release.yml (GITHUB_TOKEN cannot chain
#      release→publish events; reusable workflow keeps OIDC on publish.yml)
#
# One-time setup on npmjs.com:
#   Package settings -> Trusted Publisher -> GitHub Actions
#   Repo: clezcoding/awesome-coolify, Workflow: publish.yml
on:
  release:
    types: [published]
  workflow_call:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # npm auto-detects the GitHub Actions OIDC token when npm >= 11.5.1
      # and no NODE_AUTH_TOKEN/NPM_TOKEN is set — nothing else to configure.
      - name: Publish
        run: npm publish
