name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 = Active LTS (Jul 2026); setup-node resolves latest 24.x
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Build
        run: pnpm run lint

      - name: Tests
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: pnpm test

      - name: publint
        run: pnpm run publint

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Needed for PR diff mode (VALIDATE_ALL_CODEBASE=false)
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/javascript@v9
        env:
          # Full scan only on push to main; PRs lint the git diff vs main.
          # https://megalinter.io/latest/install-github/
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Quiet PR comment spam about newer MegaLinter point releases
          SECURITY_SUGGESTIONS: false
        # Config: .mega-linter.yml at repo root (auto-discovered)

      - name: Archive MegaLinter reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: true
          path: |
            megalinter-reports
            mega-linter.log
